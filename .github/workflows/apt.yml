name: APT repository

# For every change on main, the Kreafinity package is built and published:
# - on GitHub Releases, where installed computers find their updates (no setup);
# - in the signed APT repository on GitHub Pages, once the APT_SIGNING_KEY
#   secret exists and Pages is set to « GitHub Actions » (see docs/distribution.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # GitHub Releases
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version holds the commit date and hash
      - name: Signing key
        id: key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::No APT_SIGNING_KEY secret yet: the repository is built but not published (docs/distribution.md)."
            echo "signed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # The package carries the public key (updates for installed computers).
          # A wrong secret only leaves out the APT repository: Releases still work.
          if ! packaging/apt/export-public-key.sh; then
            echo "::warning::APT_SIGNING_KEY cannot sign: the APT repository is not published; updates still come from GitHub Releases."
            echo "signed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | gpg --batch --quiet --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "fingerprint=$fingerprint" >>"$GITHUB_OUTPUT"
          echo "signed=true" >>"$GITHUB_OUTPUT"
      - name: Tools
        run: |
          pip install uv
          sudo apt-get install -y -q apt-utils
      - name: Package
        run: packaging/debian/build-deb.sh dist
      - name: Release (updates of installed computers)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/release/publish.sh dist
      - name: Repository
        if: steps.key.outputs.signed == 'true'
        env:
          KREAFINITY_APT_KEY: ${{ steps.key.outputs.fingerprint }}
        run: packaging/apt/build-repo.sh dist site
      - uses: actions/upload-pages-artifact@v5
        if: steps.key.outputs.signed == 'true'
        with:
          path: site

  publish:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
