name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install desktop test tools (virtual X display, GTK and WebKitGTK for the bubble)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xdotool x11-apps x11-utils libglib2.0-bin \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install the browser for the web interface tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          shellcheck packaging/install.sh packaging/debian/build-deb.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm packaging/apt/build-repo.sh packaging/apt/new-signing-key.sh packaging/apt/export-public-key.sh packaging/iso/build-iso.sh packaging/iso/config/hooks/live/0100-kreafinity.hook.chroot packaging/iso/config/includes.chroot/usr/lib/live/config/1200-kreafinity-nolock
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest

  package:
    # The Debian package: built, installed with APT on this clean machine, tried,
    # removed, and kept as a download of the run (Actions › this run › Artifacts).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version holds the commit date and hash
      - name: Install uv (downloads the package's own Python)
        run: pip install uv
      - name: Build
        run: packaging/debian/build-deb.sh dist
      - name: Install with APT
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/kreafinity_*.deb
      - name: Try it
        run: |
          kreafinity version | grep -q "paquet"
          if kreafinity update --check; then exit 1; fi  # updates come from APT
          test -L /etc/systemd/user/graphical-session.target.wants/kreafinity.service
          test -L /usr/share/plasma/plasmoids/org.kreafinity.assistant
          kreafinity-core --port 27911 &
          daemon=$!
          for _ in $(seq 30); do curl -sf http://127.0.0.1:27911/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:27911/api/health | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:27911/ | grep -q "<title>Kreafinity</title>"
          kill "$daemon"
      - name: Remove
        run: |
          sudo apt-get purge -y -q kreafinity
          test ! -e /opt/kreafinity && test ! -e /usr/bin/kreafinity
          test ! -e /usr/share/plasma/plasmoids/org.kreafinity.assistant
      - uses: actions/upload-artifact@v7
        with:
          name: kreafinity-deb
          path: dist/kreafinity_*.deb
          retention-days: 30
