[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kreafinity-os"
version = "0.1.0.dev0"
description = "AI-driven open source operating system layer where you choose your LLM provider."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "David LAW-DUNE", email = "contact@kreafinity.com" }]
keywords = ["ai", "llm", "linux", "assistant", "operating-system", "ollama"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
kreafinity = "kreafinity.cli:app"

[project.urls]
Homepage = "https://kreafinity.com"
Repository = "https://github.com/LAWD-CREATION/kreafinity-OS"

[tool.hatch.build.targets.wheel]
packages = ["core/kreafinity"]

# --- Quality tools -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "core"
packages = ["kreafinity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
