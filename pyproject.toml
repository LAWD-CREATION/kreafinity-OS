[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kreafinity-os"
version = "0.1.0.dev0"
description = "AI-driven open source operating system layer where you choose your LLM provider."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "David LAW-DUNE", email = "contact@kreafinity.com" }]
keywords = ["ai", "llm", "linux", "assistant", "operating-system", "ollama"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=2.10",
    "openai>=3.50",
    "mistralai>=3.8",
    "psutil>=5.9",
    "jsonschema>=4.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "keyring>=25",
    "dbus-fast>=5.0",  # screen brightness via systemd-logind (D-Bus)
    "Pillow>=10",  # screenshots made small enough for the AI
    "pypdf>=4",  # the text of PDF files sent in the conversation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "playwright>=1.45",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-psutil",
    "types-jsonschema",
]
# Talking to the assistant (also installed by « kreafinity voice install »).
voice = ["faster-whisper>=1.1", "piper-tts>=1.3"]

[project.scripts]
kreafinity = "kreafinity.cli:app"
kreafinity-core = "kreafinity.api.server:main"

[project.urls]
Homepage = "https://kreafinity.com"
Repository = "https://github.com/LAWD-CREATION/kreafinity-OS"

[tool.hatch.build.targets.wheel]
packages = ["core/kreafinity"]

[tool.hatch.build.targets.wheel.force-include]
# The web interface ships inside the package (kreafinity/web).
"ui/web" = "kreafinity/web"
"ui/desktop" = "kreafinity/desktop"
"ui/plasma" = "kreafinity/plasma_assets"

# --- Quality tools -----------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# JavaScript run in web pages, kept readable as written.
"core/kreafinity/browser/scripts.py" = ["E501", "UP031"]
"core/kreafinity/pilot/desktop.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "core"
packages = ["kreafinity"]

[[tool.mypy.overrides]]
# Optional dependency of the OpenAI SDK, whose stubs need a newer Python syntax.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true  # also used by the optional voice engines

[[tool.mypy.overrides]]
# Optional voice engines (kreafinity voice install), absent from most installs.
module = ["av", "av.*", "faster_whisper", "faster_whisper.*", "piper", "piper.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
