<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.55" stop-color="#11132b"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="560" cy="430" rx="720" ry="520" fill="url(#glowViolet)"/>
  <ellipse cx="1420" cy="700" rx="680" ry="480" fill="url(#glowCyan)"/>
  <!-- The infinity of the logo, large and soft, with a sharp line on top. -->
  <g transform="translate(960 500) scale(9) translate(-70 -50)">
    <path d="M70 50C60 30 30 28 24 50s36 20 46 0 40-22 46 0-36 20-46 0Z" fill="none"
          stroke="url(#kf)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.35" filter="url(#soft)"/>
    <path d="M70 50C60 30 30 28 24 50s36 20 46 0 40-22 46 0-36 20-46 0Z" fill="none"
          stroke="url(#kf)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.9"/>
  </g>
  <text x="960" y="905" text-anchor="middle" fill="#e7eaf3" fill-opacity="0.55"
        font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="34"
        letter-spacing="14">KREAFINITY</text>
</svg>
